name: ci
on:
  pull_request:
  push: { branches: [main] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: better-ade/.github/.github/workflows/verify.yml@v1
    with: { command: "bash tests/run.sh", runs-on: macos-latest, setup: "brew install age" }
  ci-linux:
    uses: better-ade/.github/.github/workflows/verify.yml@v1
    with: { command: "bash tests/run.sh", runs-on: ubuntu-latest, setup: "sudo apt-get update -q && sudo apt-get install -y -q age" }
