name: ci
on:
  pull_request:
  push: { branches: [main] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Both setups install gitleaks, so the tests that use it run (the shared workflow deletes its own copy first). Ubuntu
# 24.04 packages gitleaks 8.16, older than the `gitleaks stdin` bin/learn runs: the pinned release, as bin/server pins it.
jobs:
  ci:
    uses: better-ade/.github/.github/workflows/verify.yml@v1
    with: { command: "bash tests/run.sh", runs-on: macos-latest, setup: "brew install age gitleaks" }
  ci-linux:
    uses: better-ade/.github/.github/workflows/verify.yml@v1
    with: { command: "bash tests/run.sh", runs-on: ubuntu-latest, setup: "sudo apt-get update -q && sudo apt-get install -y -q age && curl -sSLo /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz && echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz' | sha256sum -c - && sudo tar xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks" }
